<html lang="pt-BR">

<style>

.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:10;pointer-events:none}
.badge{white-space:nowrap}.score{cursor:pointer}
.dw{position:relative;width:130px;height:130px;flex-shrink:0}.dw svg{position:absolute;inset:0}.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:21px;font-weight:900}.dc small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.leg div{align-items:flex-start}.leg small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.leg i{margin-top:4px;flex-shrink:0}
.fab.jv{bottom:calc(150px + env(safe-area-inset-bottom));width:48px;height:48px;font-size:21px;background:var(--panel2);border:1px solid var(--green);color:var(--green);animation:none;right:max(22px,calc(50% - 358px))}
.orbw{display:grid;place-items:center;margin:18px 0 10px}.orb{position:relative;width:88px;height:88px;border-radius:50%;border:0;font-size:32px;background:radial-gradient(circle at 35% 30%,#7CF5C0,#1CA56C 60%,#0D5C3D);box-shadow:0 0 30px #2BE09066;transition:transform .2s}.orb:active{transform:scale(.92)}
.orb span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--green);opacity:0}.orb.on{background:radial-gradient(circle at 35% 30%,#FFE79A,#E0A91F 60%,#8a6410);box-shadow:0 0 40px #F3C96988}.orb.on span{animation:wave 1.4s infinite}
@keyframes wave{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.jrow{display:flex;gap:8px;margin-top:12px}.jrow .field{flex:1}.jc{background:var(--panel2);border-radius:16px;padding:14px;margin-top:14px;font-size:14px;line-height:1.5}
.hr{display:flex;align-items:center;gap:8px;flex-shrink:0}.header>div:first-child{min-width:0}.heading{font-size:clamp(19px,6vw,26px)}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--green);background:var(--panel2);color:var(--green);font-weight:900;font-size:17px;padding:0;overflow:hidden;display:grid;place-items:center;flex-shrink:0;transition:transform .15s}.avatar:active{transform:scale(.88)}
.avatar img,.pfBig img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pfTop{display:grid;justify-items:center;gap:8px;margin-top:14px;text-align:center}.pfBig{position:relative;width:96px;height:96px;border-radius:50%;border:3px solid var(--green);background:var(--panel2);display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--green);cursor:pointer}
.pfCam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--green);font-size:15px;display:grid;place-items:center;border:2px solid var(--panel)}
.fab.cl{bottom:calc(206px + env(safe-area-inset-bottom))}.fab.cl svg{width:22px;height:22px}
.calc{position:fixed;left:max(16px,calc(50% - 364px));bottom:calc(90px + env(safe-area-inset-bottom));width:248px;background:var(--panel);border:1px solid var(--green);border-radius:20px;padding:10px;z-index:8;box-shadow:0 14px 40px #000a;animation:up .25s both}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--muted);cursor:grab;touch-action:none;padding:2px 4px 8px;user-select:none}.ch button{background:none;border:0;color:var(--text);font-size:22px;line-height:1;padding:0 4px}
.cd{background:var(--bg);border-radius:12px;padding:8px 12px;text-align:right;min-height:62px;overflow:hidden}.cd small{display:block;color:var(--muted);font-size:12px;min-height:16px;overflow-wrap:anywhere}.cd b{font-size:26px;font-variant-numeric:tabular-nums}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.ck button{padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:16px;font-weight:800}.ck button:active{transform:scale(.92)}.ck .op{color:var(--green)}.ck .eq{background:var(--green);color:var(--bg)}.ck .z{grid-column:span 2}.calc .btn{width:100%;margin-top:8px}
.avatar{position:relative}.avatar img,.pfBig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.orb[data-s=speaking]{background:radial-gradient(circle at 35% 30%,#B5E3FF,#2F83D8 60%,#173F7A);box-shadow:0 0 40px #6CB8FF88}.orb[data-s=speaking] span{border-color:#6CB8FF;animation:wave 1.4s infinite}.orb[data-s=thinking]{animation:bob .8s infinite;filter:saturate(.55)}.orb span{pointer-events:none}
.eq{display:flex;gap:4px;justify-content:center;align-items:center;height:28px;margin-top:6px}.eq i{width:4px;height:6px;border-radius:3px;background:var(--green);transition:background .3s}.eq.on i{animation:eqb .9s ease-in-out infinite}.eq.on i:nth-child(2){animation-delay:.12s}.eq.on i:nth-child(3){animation-delay:.24s}.eq.on i:nth-child(4){animation-delay:.36s}.eq.on i:nth-child(5){animation-delay:.48s}.eq.sp i{background:#6CB8FF}
@keyframes eqb{50%{height:26px}}
.jchat{display:grid;gap:8px;max-height:30dvh;overflow:auto;margin-top:12px}.bb{max-width:88%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.45;animation:up .3s both}.bb.u{justify-self:end;background:var(--gd);border:1px solid #236246;border-bottom-right-radius:5px}.bb.a{justify-self:start;background:var(--panel2);border-bottom-left-radius:5px}
button.pfBig{padding:0}
.pvimg{width:100%;max-height:180px;object-fit:contain;border-radius:14px;margin-top:10px;background:var(--panel2)}.pgb{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}.pgb i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}.wg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.wg .label{margin-top:12px}
.hidden{display:none!important}

</style></head>
<body><div class="app"><main class="main" id="view"></main></div>
<nav class="nav"><button data-a="tab" data-v="home"><span class="ico">⌂</span>Início</button><button data-a="tab" data-v="activity"><span class="ico">⇄</span>Extrato</button><button data-a="tab" data-v="future"><span class="ico">◷</span>Futuros</button><button data-a="tab" data-v="goals"><span class="ico">◎</span>Metas</button><button data-a="tab" data-v="account"><span class="ico">▣</span>Dados</button></nav>
<button class="fab" data-a="exp" aria-label="Novo lançamento">+</button><button class="fab jv" data-a="jarvis" aria-label="Falar com o Jarvis">🎙</button><button class="fab jv cl" data-a="calc" aria-label="Calculadora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="3"/><rect x="7" y="5" width="10" height="4" rx="1"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg></button><div class="calc hidden" id="calc"><div class="ch" id="cgrip"><span>⠿ Calculadora</span><button data-c="x" aria-label="Fechar">×</button></div><div class="cd"><small id="cex"> </small><b id="cres">0</b></div><div class="ck" id="ckeys"></div><button class="btn btn-ghost sm" data-c="use">↗ Usar em novo lançamento</button></div><div class="toast" id="toast"></div>

<button class="btn btn-ghost" style="width:100%;margin-bottom:4px" data-a="imgadd">📷 Adicionar por imagem</button><label class="label" for="amount">Valor (R$)</label><input class="field big-in" id="amount" inputmode="decimal" placeholder="0,00">

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K='meu_financeiro_transactions_v1',KG='meu_financeiro_goals_v1',KC='meu_financeiro_cfg_v1';
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
let items=ld(K,[]),goals=ld(KG,[]),cfg=ld(KC,{limit:0});if(!Array.isArray(items))items=[];if(!Array.isArray(goals))goals=[];if(!cfg||typeof cfg!=='object')cfg={limit:0};
const okP=p=>typeof p==='string'&&(p.startsWith('data:image/')||/^emoji:\S{1,8}$/u.test(p));const KP='meu_financeiro_profile_v1';let prof=ld(KP,{name:'',photo:''});if(!prof||typeof prof!=='object')prof={name:'',photo:''};prof={name:String(prof.name||'').slice(0,30),photo:okP(prof.photo)?prof.photo:''};const saveProf=()=>{try{localStorage.setItem(KP,JSON.stringify(prof));return true}catch(e){return false}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items));localStorage.setItem(KG,JSON.stringify(goals));localStorage.setItem(KC,JSON.stringify(cfg))}catch(e){toast('Não foi possível salvar. Libere espaço no navegador.')}};
const view=$('#view'),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>fmt(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const st=x=>x.status||'paid',dOf=x=>x.dueDate||(x.date||'').slice(0,10),late=x=>st(x)==='pending'&&dOf(x)&&dOf(x)<today();
const dBR=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.',''):'Sem data';
const dayDiff=v=>Math.round((new Date(v+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
const addM=v=>{const d=new Date(v+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return fmt(d)};
